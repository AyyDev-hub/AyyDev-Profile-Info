<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AyyDev Tools</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-color: #1e293b;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --text-color: #ffffff;
      --subtext-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;

      display: flex;
      justify-content: center;

      background: var(--bg-color);
      color: var(--text-color);

      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .back-button {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 12px;

      background: var(--card-color);
      color: var(--text-color);

      font-size: 22px;
      cursor: pointer;

      transition: 0.2s;
    }

    .back-button:hover {
      background: var(--primary-color);
    }

    .title {
      margin: 0;
      font-size: 28px;
    }

    /* =========================
       TOOLS LIST
    ========================= */

    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      gap: 16px;

      padding: 14px;

      background: var(--card-color);
      border-radius: 16px;

      transition:
        transform 0.2s,
        background 0.2s;
    }

    .tool-card:hover {
      transform: translateY(-2px);
    }

    .tool-image {
      width: 100px;
      height: 100px;

      flex-shrink: 0;

      object-fit: cover;
      border-radius: 12px;

      background: #0f172a;
    }

    .tool-content {
      flex: 1;
      min-width: 0;
    }

    .tool-title {
      margin: 0 0 12px;

      font-size: 20px;
      word-break: break-word;
    }

    .visit-button {
      display: inline-block;

      padding: 9px 16px;

      background: var(--primary-color);
      color: white;

      border-radius: 10px;

      text-decoration: none;
      font-size: 14px;

      transition: background 0.2s;
    }

    .visit-button:hover {
      background: var(--primary-hover);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {
      .tool-image {
        width: 80px;
        height: 80px;
      }

      .tool-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <button
        class="back-button"
        onclick="goBack()"
        aria-label="Back"
      >
        ❮
      </button>

      <h1 class="title">AyyDev Tools</h1>
    </header>

    <section
      id="tools"
      class="tools-list"
    ></section>

  </main>

  <script>
    /* =========================
       CONFIGURATION
    ========================= */

    const GITHUB_USERNAME = "AyyDev-hub";
    const GITHUB_REPOSITORY = "game-thumbnails";
    const GITHUB_BRANCH = "main";

    const GITHUB_IMAGE_FOLDER = "tools";


    /* =========================
       TOOLS DATA
    ========================= */

    const toolsList = [
      {
        title: "3D Model Viewer",
        link: "https://ayydev-hub.github.io/3D-Model-Viewer"
      },
    ];


    /* =========================
       NAVIGATION
    ========================= */

    function goBack() {
      window.location.href = "../index.html";
    }


    /* =========================
       IMAGE
    ========================= */

    function getToolImage(title) {
      return (
        `https://raw.githubusercontent.com/` +
        `${GITHUB_USERNAME}/` +
        `${GITHUB_REPOSITORY}/` +
        `${GITHUB_BRANCH}/` +
        `${GITHUB_IMAGE_FOLDER}/` +
        `${encodeURIComponent(title)}.png`
      );
    }


    /* =========================
       RENDER
    ========================= */

    function renderTools() {
      const toolsContainer = document.getElementById("tools");

      toolsContainer.innerHTML = "";

      toolsList.forEach(tool => {
        const card = document.createElement("article");
        card.className = "tool-card";

        const image = document.createElement("img");
        image.className = "tool-image";
        image.src = getToolImage(tool.title);
        image.alt = tool.title;
        image.loading = "lazy";

        const content = document.createElement("div");
        content.className = "tool-content";

        const title = document.createElement("h2");
        title.className = "tool-title";
        title.textContent = tool.title;

        const button = document.createElement("a");
        button.className = "visit-button";
        button.href = tool.link;
        button.textContent = "Visit";

        button.target = "_blank";
        button.rel = "noopener noreferrer";

        content.appendChild(title);
        content.appendChild(button);

        card.appendChild(image);
        card.appendChild(content);

        toolsContainer.appendChild(card);
      });
    }


    /* =========================
       INITIALIZE
    ========================= */

    renderTools();
  </script>

</body>
</html>
